name: Build

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Espluque.slnx -p:Platform=x64

      - run: dotnet build Espluque.slnx --configuration Release --no-restore -p:Platform=x64