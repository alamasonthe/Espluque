name: Build

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v3

      - run: msbuild Espluque.slnx /restore /p:Configuration=Release /p:Platform=x64